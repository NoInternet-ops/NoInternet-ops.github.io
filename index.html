<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internet Outage Interaction</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
}

.container {
  margin-top: 50px;
}

input, textarea {
  padding: 10px;
  margin: 10px;
  width: 250px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
}

#list {
  margin-top: 30px;
  background: white;
  padding: 15px;
  display: inline-block;
  border-radius: 10px;
}

li {
  margin: 5px 0;
}
</style>

</head>
<body>

<div class="container">
  <h1>Ask a Question</h1>

  <input id="number" placeholder="Enter your number">
  <br>

  <textarea id="question" placeholder="Write your question (optional)"></textarea>
  <br>

  <button onclick="send()">I want to ask a question</button>
</div>

<div id="list">
  <h2>Requests:</h2>
  <ul id="requests"></ul>
</div>

<audio id="sound" src="https://www.soundjay.com/buttons/beep-07.wav"></audio>

<script>
let requests = [];

function send(){
  let number = document.getElementById("number").value;
  let question = document.getElementById("question").value;

  if(number === ""){
    alert("Enter your number!");
    return;
  }

  let entry = "Number: " + number;

  if(question !== ""){
    entry += " | Question: " + question;
  }

  requests.push(entry);
  updateList();

  document.getElementById("sound").play();

  document.getElementById("number").value = "";
  document.getElementById("question").value = "";
}

function updateList(){
  let list = document.getElementById("requests");
  list.innerHTML = "";

  requests.forEach(r => {
    let li = document.createElement("li");
    li.textContent = r;
    list.appendChild(li);
  });
}

// 💣 UKRYTY TRIGGER (klik w prawy górny róg)
document.addEventListener("click", function(e){
  if(e.clientX > window.innerWidth - 60 && e.clientY < 60){
    outage();
  }
});

// 📱 działa też na telefonie (dotyk)
document.addEventListener("touchstart", function(e){
  let touch = e.touches[0];
  if(touch.clientX > window.innerWidth - 60 && touch.clientY < 60){
    outage();
  }
});

function outage(){
  document.body.innerHTML = `
    <div style="background:black; color:red; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <h1>NO INTERNET CONNECTION</h1>
      <p>Reconnecting...</p>
    </div>
  `;
}
</script>

</body>
</html>
