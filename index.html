<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internet Outage Live</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  margin: 0;
}

.container {
  margin-top: 40px;
}

input, textarea {
  padding: 10px;
  margin: 10px;
  width: 260px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
}

#list {
  margin-top: 20px;
  background: white;
  padding: 15px;
  display: inline-block;
  border-radius: 10px;
}

#adminPanel {
  display: none;
  margin-top: 20px;
}

.offline {
  background: #fff;
  color: #333;
  height: 100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.big-icon {
  font-size: 80px;
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"></script>

</head>
<body>

<div class="container">
  <h1>Ask a Question</h1>

  <input id="number" placeholder="Your number">
  <br>

  <textarea id="question" placeholder="Your question (optional)"></textarea>
  <br>

  <button onclick="send()">I want to ask a question</button>

  <br><br>

  <!-- LOGIN -->
  <input type="password" id="pass" placeholder="Teacher password">
  <button onclick="login()">Login</button>

  <div id="adminPanel">
    <button onclick="triggerOutage()">⚠️ TRIGGER OUTAGE</button>
  </div>
</div>

<div id="list">
  <h2>Live Requests:</h2>
  <ul id="requests"></ul>
</div>

<audio id="sound" src="https://www.soundjay.com/buttons/beep-07.wav"></audio>

<script>
// 🔥 TU WSTAW SWOJE DANE FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyC7YJdUPNMhdcwkSeqJqCmD9phwCUjl-wY",
  authDomain: "nointernet-4e893.firebaseapp.com",
  databaseURL: "https://nointernet-4e893-default-rtdb.firebaseio.com/",
  projectId: "nointernet-4e893",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// LOGIN (tylko dla Ciebie)
function login(){
  if(document.getElementById("pass").value === "1234"){
    document.getElementById("adminPanel").style.display = "block";
  }
}

// wysyłanie
function send(){
  let number = document.getElementById("number").value;
  let question = document.getElementById("question").value;

  if(!number) return alert("Enter number!");

  db.ref("requests").push({
    number,
    question
  });

  document.getElementById("sound").play();

  document.getElementById("number").value = "";
  document.getElementById("question").value = "";
}

// odbieranie (LIVE 🔥)
db.ref("requests").on("value", snapshot => {
  let data = snapshot.val();
  let list = document.getElementById("requests");
  list.innerHTML = "";

  for(let id in data){
    let li = document.createElement("li");
    li.textContent = "No." + data[id].number + " | " + data[id].question;
    list.appendChild(li);
  }
});

// trigger awarii
function triggerOutage(){
  db.ref("outage").set(true);
}

// słuchanie awarii
db.ref("outage").on("value", snap => {
  if(snap.val()){
    showOffline();
  }
});

// ekran offline
function showOffline(){
  let counter = 5;

  document.body.innerHTML = `
    <div class="offline">
      <div class="big-icon">📡❌</div>
      <h1>No Internet</h1>
      <p>Try checking the network cables, modem, and router.</p>
      <p id="count">Reconnecting in ${counter}...</p>
    </div>
  `;

  let interval = setInterval(() => {
    counter--;
    document.getElementById("count").innerText =
      "Reconnecting in " + counter + "...";

    if(counter === 0){
      clearInterval(interval);
    }
  }, 1000);
}
</script>

</body>
</html>
